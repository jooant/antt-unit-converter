<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="header">
            <h1>
                Metric/Imperial Unit Conversion
            </h1>
            <input type="text" id="input-value" inputmode="numeric">
            <button id="btn-convert">Convert</button>
        </div>
        <div id="container">
            <div class="convert-wrapper">
                <h2 class="title">Length (Meters/Feet)</h2>
                <div id="length-convert"></div>
            </div>
            <div class="convert-wrapper">
                <h2 class="title" id="volume-el">Volume (Liters/Gallons)</h2>
                <div id="volume-convert"></div>
            </div>
            <div class="convert-wrapper">
                <h2 class="title" id="mass-el">Mass (Kilogram/Pounds)</h2>
                <div id="mass-convert"></div>
            </div>
        </div>    
        <script src="index.js"></script>
    </body>
</html>
